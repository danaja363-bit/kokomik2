<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaReader - Baca Manga Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Manga<span>Reader</span></a>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Cari manga, author...">
  </div>
  <div class="nav-actions">
    <a href="admin.html" class="btn btn-outline" id="adminBtn" style="display:none">⚙️ Admin</a>
    <button class="btn btn-outline" id="loginBtn">Masuk</button>
    <button class="btn btn-outline" id="logoutBtn" style="display:none">Keluar</button>
  </div>
</nav>

<div class="container">
  <div class="filters">
    <select id="sortFilter">
      <option value="latest">Terbaru</option>
      <option value="popular">Terpopuler</option>
      <option value="rating">Rating Tertinggi</option>
      <option value="title">Judul A-Z</option>
    </select>
    <select id="statusFilter">
      <option value="">Semua Status</option>
      <option value="ongoing">Ongoing</option>
      <option value="completed">Completed</option>
    </select>
  </div>

  <div class="genre-chips" id="genreChips"></div>

  <h2 class="page-title" id="pageTitle" style="margin-top:24px">📚 Semua Manga</h2>

  <div class="manga-grid" id="mangaGrid">
    <div class="loading" style="grid-column: 1/-1">
      <div class="spinner"></div>
      Memuat manga...
    </div>
  </div>
</div>

<!-- Modal Login/Register -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <h2 id="authTitle">Masuk</h2>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="authUsername" placeholder="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="authPassword" placeholder="password">
    </div>
    <div class="modal-actions">
      <button class="btn" id="authSubmit">Masuk</button>
    </div>
    <p style="text-align:center; margin-top:16px; font-size:13px; color:var(--text-2)">
      <a href="#" id="toggleAuth" style="color:var(--accent)">Belum punya akun? Daftar</a>
    </p>
    <p style="text-align:center; margin-top:8px; font-size:12px; color:var(--text-2)">
      Admin default: <b>admin / admin123</b>
    </p>
  </div>
</div>

<script src="app.js"></script>
<script>
  const API = 'http://localhost:3000/api';
  let allGenres = [];
  let activeGenre = '';
  let searchTimer;

  function getToken() { return localStorage.getItem('token'); }
  function getUser() {
    try { return JSON.parse(localStorage.getItem('user')); } catch { return null; }
  }

  function updateAuthUI() {
    const token = getToken();
    const user = getUser();
    document.getElementById('loginBtn').style.display = token ? 'none' : 'inline-block';
    document.getElementById('logoutBtn').style.display = token ? 'inline-block' : 'none';
    document.getElementById('adminBtn').style.display = user?.role === 'admin' ? 'inline-block' : 'none';
  }

  async function loadGenres() {
    const res = await fetch(`${API}/genres`);
    allGenres = await res.json();
    const container = document.getElementById('genreChips');
    container.innerHTML = `<div class="chip active" data-genre="">Semua</div>` +
      allGenres.map(g => `<div class="chip" data-genre="${g}">${g}</div>`).join('');
    container.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => {
        container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeGenre = chip.dataset.genre;
        loadManga();
      };
    });
  }

  async function loadManga() {
    const grid = document.getElementById('mangaGrid');
    grid.innerHTML = `<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Memuat...</div>`;
    const q = document.getElementById('searchInput').value.trim();
    const sort = document.getElementById('sortFilter').value;
    const status = document.getElementById('statusFilter').value;
    const params = new URLSearchParams({ sort });
    if (q) params.append('q', q);
    if (status) params.append('status', status);
    if (activeGenre) params.append('genre', activeGenre);

    const res = await fetch(`${API}/manga?${params}`);
    const manga = await res.json();

    document.getElementById('pageTitle').textContent = q ? `🔍 Hasil: "${q}"` : (activeGenre ? `📚 Genre: ${activeGenre}` : '📚 Semua Manga');

    if (!manga.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">😢 Tidak ada manga ditemukan</div>`;
      return;
    }
    grid.innerHTML = manga.map(m => `
      <a class="manga-card" href="manga.html?id=${m.id}">
        <img class="manga-cover" src="${m.cover ? 'http://localhost:3000' + m.cover : 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 400%22><rect fill=%22%23222%22 width=%22300%22 height=%22400%22/><text x=%22150%22 y=%22200%22 fill=%22%23666%22 font-size=%2220%22 text-anchor=%22middle%22>No Cover</text></svg>'}" 
             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 400%22><rect fill=%22%23222%22 width=%22300%22 height=%22400%22/></svg>'">
        <div class="manga-info">
          <div class="manga-title">${m.title}</div>
          <div class="manga-meta">
            <span class="badge ${m.status}">${m.status}</span>
            <span>👁 ${m.views}</span>
          </div>
        </div>
      </a>
    `).join('');
  }

  // Search debounce
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadManga, 300);
  });
  document.getElementById('sortFilter').onchange = loadManga;
  document.getElementById('statusFilter').onchange = loadManga;

  // Auth modal
  const authModal = document.getElementById('authModal');
  let isRegister = false;

  document.getElementById('loginBtn').onclick = () => authModal.classList.add('active');
  document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    updateAuthUI();
    location.reload();
  };
  document.getElementById('toggleAuth').onclick = (e) => {
    e.preventDefault();
    isRegister = !isRegister;
    document.getElementById('authTitle').textContent = isRegister ? 'Daftar' : 'Masuk';
    document.getElementById('authSubmit').textContent = isRegister ? 'Daftar' : 'Masuk';
    document.getElementById('toggleAuth').textContent = isRegister ? 'Sudah punya akun? Masuk' : 'Belum punya akun? Daftar';
  };
  authModal.onclick = (e) => { if (e.target === authModal) authModal.classList.remove('active'); };

  document.getElementById('authSubmit').onclick = async () => {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!username || !password) return alert('Isi semua field');

    const endpoint = isRegister ? 'register' : 'login';
    const res = await fetch(`${API}/auth/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error || 'Gagal');
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    location.reload();
  };

  // Init
  updateAuthUI();
  loadGenres();
  loadManga();
</script>
</body>
</html>
